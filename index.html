<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lock Ladder">
<title>Lock Ladder Scoreboard</title>
<meta name="description" content="Leaderboard for the LASCON 2026 progressive lockpicking contest.">
<style>
:root{
  --bg:#f6f1e7; --panel:#fffdf8; --ink:#1b1a17; --muted:#5d574c; --rule:#b9ae98;
  --accent:#8a5a12; --accent-ink:#fffdf8; --good:#1f5f3a; --bad:#8c2f1b;
  --display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit}
button{cursor:pointer}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}

/* ---------- judge view ---------- */
.judge{max-width:1100px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:20px}
.judge header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:12px}
.judge header h1{font-size:44px;font-weight:800}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:24px;font-weight:800}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input,select{padding:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > label{flex:1 1 140px}
.btn{min-height:44px;padding:10px 16px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.btn.secondary{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:32px;padding:4px 10px;font-size:14px;border-width:1px}
.msg{min-height:1.4em;font-size:14px;font-weight:600}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
.preview{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{border-bottom:2px solid var(--ink);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-style:italic}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.finalist td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.flush{margin:0}
.addrow{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.addrow > label{flex:1 1 200px}
.addrow > label.narrow{flex:0 0 120px}
table.entry td{padding:6px}
table.entry input.handle{width:100%;min-width:8em}
.stepper{display:flex;gap:6px;align-items:center}
.stepper .step{min-width:44px;padding:0;font-size:22px;line-height:1}
.stepper .step[disabled]{opacity:.35;cursor:default}
.stepper input.locks{width:3.2em;text-align:center;font-weight:700;font-size:18px}
.login{max-width:420px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- projector view ---------- */
/* one place to retune for a washed-out projector */
body.display{--d-bg:#15130f;--d-ink:#f6f1e7;--d-accent:#e0a84a;--d-muted:#d8cfbd;--d-rule:#4a4438;--d-pip:#8f8574;
  background:var(--d-bg);color:var(--d-ink);overflow:hidden}
/* budget: ~33vh of chrome + 10 rows x 6vh = ~93vh; JS drops rows per page if a projector still overflows */
.board{height:100vh;display:flex;flex-direction:column;padding:3.2vh 4vw;gap:2.2vh}
.board-head{display:flex;justify-content:space-between;align-items:end;border-bottom:.5vh solid var(--d-ink);padding-bottom:1.6vh;gap:2vw}
.board-head h1{font-size:8vh;font-weight:800}
.board-head .eyebrow{font-size:2.4vh;color:var(--d-accent)}
.board-head .meta{text-align:right;font-size:2.6vh;color:var(--d-muted);line-height:1.3}
.board-head .meta strong{color:var(--d-accent)}
.board table{font-size:3.6vh;flex:0 0 auto}
.board th{font-size:2.2vh;color:var(--d-muted);border-bottom:.3vh solid var(--d-ink);padding:.6vh 1vw}
.board td{height:6vh;padding:0 1vw;line-height:1.1;border-bottom:.15vh solid var(--d-rule)}
.board td.rank{font-family:var(--display);font-weight:800;width:8vw;color:var(--d-muted)}
.board td.name{font-weight:700;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board td.pts{font-family:var(--display);font-weight:800;font-size:4.4vh}
.board tr.finalist td.rank{color:var(--d-accent)}
.board tr.cutline td{border-bottom:.4vh dashed var(--d-accent)}
.pips{display:inline-flex;gap:.6vw;vertical-align:middle}
.pip{width:2.6vh;height:2.6vh;border:.3vh solid var(--d-pip);display:inline-block}
.pip.on{background:var(--d-accent);border-color:var(--d-accent)}
.board .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:2.4vh;color:var(--d-muted);gap:2vw}
.board .empty{color:var(--d-muted);font-size:4vh;padding:4vh 0}
.banner{position:fixed;left:0;right:0;bottom:0;background:var(--d-accent);color:var(--d-bg);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:6vh;padding:2.4vh 4vw;transform:translateY(110%);transition:transform .35s ease}
.banner.show{transform:none}
@media (prefers-reduced-motion:reduce){.banner{transition:none}}

/* ---------- public live view (phones and laptops) ---------- */
body.display.live{overflow:auto}
.live .board{height:auto;min-height:100vh;max-width:900px;margin:0 auto;padding:24px 16px;gap:16px}
.live .board-head{flex-wrap:wrap;border-bottom-width:3px;padding-bottom:12px;gap:8px}
.live .board-head h1{font-size:clamp(36px,8vw,64px)}
.live .board-head .eyebrow{font-size:12px}
.live .board-head .meta{font-size:14px;text-align:left}
.live .board table{font-size:clamp(16px,3.6vw,24px)}
.live .board th{font-size:12px;padding:6px;border-bottom-width:2px}
.live .board td{height:auto;line-height:1.45;padding:10px 6px;border-bottom-width:1px}
.live .board td.rank{width:auto}
.live .board td.name{max-width:none;white-space:normal}
.live .board td.pts{font-size:clamp(20px,4.4vw,30px)}
.live .board tr.cutline td{border-bottom-width:3px}
.live .pips{gap:4px}
.live .pip{width:12px;height:12px;border-width:2px}
.live .board .foot{font-size:13px;flex-wrap:wrap}
.live .board .empty{font-size:18px;padding:24px 0}
.live .banner{font-size:clamp(18px,4vw,32px);padding:14px 16px}
</style>
</head>
<body>
<div id="app"></div>
<div class="sr-only" id="announce" role="status" aria-live="polite"></div>
<div class="banner" id="banner" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ---- contest config ----
  // Two things are entered per picker: a handle and how many locks they have opened.
  var LADDER = 5;          // locks on the ladder; drawn as pips on the board
  var FINALISTS = 5;
  var KEY = 'lascon-lock-ladder-2026';
  var channel = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;

  // ---- state: { pickers: [{ id, name, locks, at }], lastChange } ----
  // `at` = when the picker reached their current count (earlier wins a tie).
  function blank() { return { pickers: [], lastChange: null }; }
  function normalize(s) {
    if (!s) return null;
    if (Array.isArray(s.pickers)) {
      return { pickers: s.pickers.filter(function (p) { return p && p.id && typeof p.name === 'string'; })
        .map(function (p) { return { id: p.id, name: p.name, locks: Math.max(0, Math.floor(+p.locks) || 0), at: +p.at || 0 }; }),
        lastChange: s.lastChange || null, updated: s.updated || null };
    }
    // older format (contestants + timed opens): a picker's highest level becomes their lock count
    if (Array.isArray(s.contestants) && Array.isArray(s.opens)) {
      return { pickers: s.contestants.map(function (c) {
        var top = 0, at = c.ts || 0;
        s.opens.forEach(function (o) { if (o.cid === c.id && o.level > top) { top = o.level; at = o.ts; } });
        return { id: c.id, name: c.name, locks: top, at: at };
      }), lastChange: null };
    }
    return null;
  }
  function load() {
    try { var s = normalize(JSON.parse(localStorage.getItem(KEY))); if (s) return s; } catch (e) {}
    return blank();
  }
  var state = load();
  function save() {
    state.updated = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (channel) channel.postMessage('changed');
    schedulePublish();
  }

  // ---- online copy: the judge laptop writes scores.json to the `scores`
  // branch (not main, so Pages never rebuilds); the public page reads it. ----
  var API = 'https://api.github.com/repos/dougray/lascon-lockpick-scoreboard/contents/scores.json';
  var BRANCH = 'scores';
  // Public reads go through GitHub's raw CDN, not the API (60 calls/hour per IP unauthenticated,
  // which one tab on shared venue Wi-Fi would use up). The CDN caches for 5 minutes and ignores
  // query strings, so the public page can lag the judge laptop by up to ~5 min.
  var RAW = 'https://raw.githubusercontent.com/dougray/lascon-lockpick-scoreboard/' + BRANCH + '/scores.json';
  var LIVE_EVERY = 60000;
  var TOKEN_KEY = KEY + '-token';
  var sync = { status: 'idle', at: null, err: '', sha: null, timer: null, busy: false, pending: false, gen: 0 };

  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function httpErr(r) {
    var m = r.status === 401 ? 'GitHub rejected the token (401); it may be wrong or expired'
          : (r.status === 403 || r.status === 404) ? 'the token cannot write to this repo (' + r.status + ')'
          : 'GitHub answered ' + r.status;
    return new Error(m);
  }
  function schedulePublish() {
    if (isDisplay || isLive || !getToken() || !loggedIn()) return;
    sync.gen++; sync.pending = true;
    clearTimeout(sync.timer);
    sync.timer = setTimeout(publish, 3000);
  }
  function publish() {
    var token = getToken();
    if (!token) return;
    if (sync.busy) { clearTimeout(sync.timer); sync.timer = setTimeout(publish, 2000); return; }
    sync.busy = true; sync.status = 'sending'; syncChanged();
    var gen = sync.gen;
    var headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    var body = JSON.stringify({ updated: state.updated || new Date().toISOString(), pickers: state.pickers, lastChange: state.lastChange });
    function getSha() {
      return fetch(API + '?ref=' + BRANCH, { headers: headers, cache: 'no-store' }).then(function (r) {
        if (r.status === 404) return null;
        if (!r.ok) throw httpErr(r);
        return r.json().then(function (j) { return j.sha; });
      });
    }
    function put(sha) {
      var req = { message: 'Update scores', content: b64(body), branch: BRANCH };
      if (sha) req.sha = sha;
      return fetch(API, { method: 'PUT', headers: headers, body: JSON.stringify(req) });
    }
    (sync.sha ? Promise.resolve(sync.sha) : getSha())
      .then(put)
      .then(function (r) { return (r.status === 409 || r.status === 422) ? getSha().then(put) : r; })
      .then(function (r) { if (!r.ok) throw httpErr(r); return r.json(); })
      .then(function (j) { sync.sha = j.content.sha; sync.status = 'ok'; sync.at = new Date(); sync.err = ''; if (gen === sync.gen) sync.pending = false; })
      .catch(function (e) {
        sync.sha = null; sync.status = 'error';
        sync.err = (e && e.message && !/fetch/i.test(e.message)) ? e.message : 'no connection';
        clearTimeout(sync.timer); sync.timer = setTimeout(publish, 60000);
      })
      .then(function () { sync.busy = false; syncChanged(); });
  }
  // ---- pick up changes made on another judge device (e.g. your phone) ----
  // Only when nothing local is waiting to publish, so an unsent edit is never thrown away.
  function pullLatest() {
    var token = getToken();
    if (isDisplay || !token || !loggedIn() || sync.pending || sync.busy) return;
    fetch(API + '?ref=' + BRANCH, { cache: 'no-store', headers: { Authorization: 'Bearer ' + token,
      Accept: 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var n = j && normalize(j);
        if (!n || !n.updated || sync.pending || sync.busy) return;
        if (!state.updated || n.updated > state.updated) {
          state = n; sync.sha = null;
          try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
          if (channel) channel.postMessage('changed');
          setMsg('Loaded the latest scores (saved ' + new Date(n.updated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' on another device).', 'ok');
          renderJudge();
        } else if (state.updated > n.updated) {
          schedulePublish();   // this device has newer edits that never went out
        }
      })
      .catch(function () {});
  }

  // ---- judge login (the board and public pages stay open) ----
  // Only a salted PBKDF2 hash is stored here, never the password. This gates the judge screen;
  // the GitHub token is what actually guards the online scores.
  var AUTH = {"salt":"eWFS2GkExyXtnkHQI8CxKw==","iter":310000,"hash":"4VZNDBHJwVlYuGHFzGzpKDADxOx/cFWFcvFBeZfv9I0="};
  var SESSION_KEY = KEY + '-session', SESSION_HOURS = 12;
  var login = { busy: false, err: '', fails: 0, until: 0, user: '' };
  function loggedIn() { try { return +localStorage.getItem(SESSION_KEY) > Date.now(); } catch (e) { return false; } }
  function b64d(str) { return Uint8Array.from(atob(str), function (c) { return c.charCodeAt(0); }); }
  function checkLogin(u, pw) {
    if (!window.crypto || !crypto.subtle) return Promise.reject(new Error('no crypto'));
    return crypto.subtle.importKey('raw', new TextEncoder().encode(u + '\n' + pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(AUTH.salt), iterations: AUTH.iter }, k, 256); })
      .then(function (bits) {
        var a = new Uint8Array(bits), b = b64d(AUTH.hash), d = a.length ^ b.length;
        for (var i = 0; i < a.length && i < b.length; i++) d |= a[i] ^ b[i];
        return d === 0;
      });
  }

  function syncText() {
    if (!getToken()) return 'Off. No token saved on this device, so the public page is not updating.';
    if (sync.status === 'sending') return 'Publishing…';
    if (sync.status === 'ok') return 'Published at ' + sync.at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '. The public page shows it within about 5 minutes.';
    if (sync.status === 'error') return 'Not published: ' + sync.err + '. Retrying every minute; scores are safe on this device.';
    return 'On. Changes publish a few seconds after each save.';
  }
  var lastSyncStatus = 'idle';
  function syncChanged() {
    if (!isDisplay && sync.status === 'error' && lastSyncStatus !== 'error') announce(syncText());
    lastSyncStatus = sync.status;
    var el = document.getElementById('syncstatus');
    if (!el) return;
    el.textContent = syncText();
    el.className = 'msg' + (sync.status === 'error' ? ' err' : sync.status === 'ok' ? ' ok' : '');
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---- ranking: most locks, then whoever got there first ----
  function standings() {
    return state.pickers.slice().sort(function (a, b) {
      return b.locks - a.locks || a.at - b.at || a.name.localeCompare(b.name);
    });
  }
  function byId(id) { return state.pickers.filter(function (p) { return p.id === id; })[0]; }
  function changeKey() { var c = state.lastChange; return c ? c.id + ':' + c.locks + ':' + c.ts : ''; }

  // ---- tiny DOM helper (text only, never innerHTML with user data) ----
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    [].concat(kids == null ? [] : kids).forEach(function (k) {
      if (k == null || k === false) return;
      el.appendChild(typeof k === 'object' ? k : document.createTextNode(String(k)));
    });
    return el;
  }

  var params = new URLSearchParams(location.search);
  var isLive = params.get('view') === 'live';     // public page, phone layout
  var isBoard = params.get('view') === 'board';   // iPad at the table: big layout, online scores
  var isRemote = isLive || isBoard;
  var isDisplay = params.get('view') === 'display' || isRemote;
  var app = document.getElementById('app');

  // =============== BOARD (iPad / display / public) ===============
  var page = 0, PER_PAGE = 10, lastSeen = changeKey(), bannerTimer = null;

  function renderDisplay() {
    document.body.className = isLive ? 'display live' : 'display';
    var rows = standings();
    var per = isLive ? Math.max(1, rows.length) : PER_PAGE;
    var pages = Math.max(1, Math.ceil(rows.length / per));
    if (page >= pages) page = 0;
    var slice = rows.slice(page * per, page * per + per);

    var body = slice.map(function (p, i) {
      var rank = page * per + i + 1;
      var pips = [];
      for (var n = 1; n <= LADDER; n++) pips.push(h('span', { class: 'pip' + (p.locks >= n ? ' on' : '') }));
      var cls = (rank <= FINALISTS && p.locks > 0 ? 'finalist' : '') + (rank === FINALISTS ? ' cutline' : '');
      return h('tr', { class: cls }, [
        h('td', { class: 'rank' }, rank),
        h('td', { class: 'name' }, p.name),
        h('td', null, h('span', { class: 'pips', role: 'img', 'aria-label': p.locks + ' of ' + LADDER + ' locks' }, pips)),
        h('td', { class: 'num pts' }, p.locks)
      ]);
    });

    var updated = live.updated ? 'Updated ' + new Date(live.updated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    app.replaceChildren(h('div', { class: 'board' }, [
      h('div', { class: 'board-head' }, [
        h('div', null, [
          h('div', { class: 'eyebrow' }, 'LASCON 2026 · Lockpicking contest'),
          h('h1', null, 'The Lock Ladder')
        ]),
        h('div', { class: 'meta' }, [
          h('div', null, [h('strong', null, 'Top ' + FINALISTS), ' at 2:00 pm Fri go to the final']),
          h('div', null, 'Final · Fri Oct 30 · 3:00 pm · ' + (isLive ? 'locksport table, vendor room' : 'this table'))
        ])
      ]),
      rows.length
        ? h('table', null, [
            h('thead', null, h('tr', null, [
              h('th', null, 'Rank'), h('th', null, 'Handle'), h('th', null, 'Ladder'), h('th', { class: 'num' }, 'Locks')
            ])),
            h('tbody', null, body)
          ])
        : h('div', { class: 'empty' }, isRemote && live.err ? live.err : 'No picks yet. Sign up at the locksport table and start at lock 1.'),
      h('div', { class: 'foot' }, [
        h('span', null, rows.length + (rows.length === 1 ? ' picker' : ' pickers') + ' on the ladder'),
        isLive ? h('span', null, live.err && rows.length ? live.err : (updated ? updated + ' · can run up to 5 min behind the table' : 'Refreshes every minute'))
          : isBoard ? h('span', null, (live.err && rows.length ? live.err : (updated || 'Waiting for scores')) + (pages > 1 ? ' · Page ' + (page + 1) + ' of ' + pages : ''))
          : h('span', null, pages > 1 ? 'Page ' + (page + 1) + ' of ' + pages : 'Most locks wins · ties go to whoever got there first')
      ])
    ]));

    // banner when someone moves up
    var key = changeKey();
    if (key && key !== lastSeen && state.lastChange.up) {
      var p = byId(state.lastChange.id);
      if (p) showBanner(p.name + ' opened lock ' + state.lastChange.locks + '!');
    }
    lastSeen = key;

    // safety net for odd screen sizes: never clip a row
    var b = app.firstChild;
    if (!isLive && PER_PAGE > 4 && slice.length === PER_PAGE && b.scrollHeight > b.clientHeight + 1) {
      PER_PAGE--; renderDisplay();
    }
  }
  function showBanner(text) {
    var b = document.getElementById('banner');
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { b.classList.remove('show'); }, 7000);
  }

  // ---- public live view: read the published copy ----
  var live = { updated: null, err: '', first: true, fails: 0, timer: null };
  function nextPoll() {
    clearTimeout(live.timer);
    if (document.hidden) return; // resumes on visibilitychange
    // back off on repeated failures (1, 2, 4, max 8 min) with jitter so shared-IP tabs don't sync up
    var wait = LIVE_EVERY * Math.min(8, Math.pow(2, live.fails)) * (0.85 + Math.random() * 0.3);
    live.timer = setTimeout(pollLive, wait);
  }
  function pollLive() {
    clearTimeout(live.timer);
    fetch(RAW, { cache: 'no-cache' })
      .then(function (r) {
        if (r.status === 404) return null;
        if (r.status === 403 || r.status === 429) throw new Error('busy');
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function (j) {
        var n = j && normalize(j);
        if (n) { state = n; live.updated = j.updated; }
        live.err = ''; live.fails = 0;
      })
      .catch(function (e) {
        live.fails++;
        live.err = e && e.message === 'busy'
          ? 'GitHub is busy. Showing the last scores we got; trying again shortly.'
          : (navigator.onLine === false ? 'You\u2019re offline. Showing the last scores we got.'
          : 'Can\u2019t reach the scoreboard right now. Retrying.');
      })
      .then(function () {
        if (live.first) { lastSeen = changeKey(); live.first = false; }
        renderDisplay();
        nextPoll();
      });
  }

  // =============== JUDGE VIEW: two columns, handle + locks opened ===============
  var ui = { name: '', locks: '0', filter: '', msg: '', msgKind: '', focus: '' };

  function setMsg(text, kind) { ui.msg = text; ui.msgKind = kind; announce(text); }
  function announce(text) {
    var el = document.getElementById('announce');
    el.textContent = '';
    setTimeout(function () { el.textContent = text; }, 50);
  }
  function cleanName(v) { return String(v || '').trim().replace(/\s+/g, ' ').slice(0, 40); }
  function nameTaken(name, exceptId) {
    var n = name.toLowerCase();
    return state.pickers.some(function (p) { return p.id !== exceptId && p.name.toLowerCase() === n; });
  }
  function parseLocks(v) {
    v = String(v).trim();
    if (!/^\d{1,2}$/.test(v)) return NaN;
    return +v;
  }

  function setLocks(p, locks) {
    if (isNaN(locks) || locks < 0) { setMsg('Locks opened must be a whole number, 0 or more.', 'err'); return renderJudge(); }
    if (locks === p.locks) return renderJudge();
    var up = locks > p.locks;
    p.locks = locks; p.at = Date.now();
    state.lastChange = { id: p.id, locks: locks, up: up, ts: p.at };
    setMsg(p.name + ': ' + locks + (locks === 1 ? ' lock' : ' locks') + ' opened.', 'ok');
    save(); renderJudge();
  }

  function addPicker(e) {
    e.preventDefault();
    var name = cleanName(ui.name), locks = parseLocks(ui.locks);
    if (!name) { setMsg('Enter a handle or nickname.', 'err'); ui.focus = 'j-name'; return renderJudge(); }
    if (nameTaken(name)) { setMsg(name + ' is already on the board. Use a different handle.', 'err'); ui.focus = 'j-name'; return renderJudge(); }
    if (isNaN(locks)) { setMsg('Locks opened must be a whole number, 0 or more.', 'err'); ui.focus = 'j-locks'; return renderJudge(); }
    var p = { id: uid(), name: name, locks: locks, at: Date.now() };
    state.pickers.unshift(p);
    state.lastChange = locks > 0 ? { id: p.id, locks: locks, up: true, ts: p.at } : state.lastChange;
    ui.name = ''; ui.locks = '0'; ui.focus = 'j-name';
    setMsg('Added ' + name + ' with ' + locks + (locks === 1 ? ' lock.' : ' locks.'), 'ok');
    save(); renderJudge();
  }

  function renamePicker(p, value) {
    var name = cleanName(value);
    if (!name || name === p.name) return renderJudge();
    if (nameTaken(name, p.id)) { setMsg(name + ' is already on the board.', 'err'); return renderJudge(); }
    p.name = name; setMsg('Renamed to ' + name + '.', 'ok'); save(); renderJudge();
  }

  function removePicker(p) {
    if (!confirm('Remove ' + p.name + ' from the board?')) return;
    state.pickers = state.pickers.filter(function (x) { return x.id !== p.id; });
    if (state.lastChange && state.lastChange.id === p.id) state.lastChange = null;
    setMsg('Removed ' + p.name + '.', 'ok'); save(); renderJudge();
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = h('a', { href: URL.createObjectURL(blob), download: 'lock-ladder-backup-' + new Date().toISOString().slice(0, 16).replace(':', '') + '.json' });
    document.body.appendChild(a); a.click(); a.remove();
  }
  function importData(e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (t) {
      var s = normalize(JSON.parse(t));
      if (!s) throw new Error('bad file');
      if (!confirm('Replace everything on this device with the backup file?')) return;
      state = s; setMsg('Backup restored.', 'ok'); save(); renderJudge();
    }).catch(function () { setMsg('That file is not a scoreboard backup.', 'err'); renderJudge(); });
    e.target.value = '';
  }
  function resetAll() {
    if (!confirm('Erase every picker and score? Export a backup first.')) return;
    if (prompt('Type RESET to confirm') !== 'RESET') return;
    state = blank(); setMsg('Scoreboard cleared.', 'ok'); save(); renderJudge();
  }

  function renderLogin(focusId) {
    document.body.className = '';
    app.replaceChildren(h('main', { class: 'judge' }, [
      h('header', null, [h('div', null, [h('div', { class: 'eyebrow' }, 'LASCON 2026 · Judge station'), h('h1', null, 'Lock Ladder Scoreboard')])]),
      h('form', { class: 'card login', onsubmit: doLogin }, [
        h('h2', null, 'Judge login'),
        h('label', null, ['Username', h('input', { id: 'l-user', name: 'username', value: login.user, autocomplete: 'username', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
          oninput: function (e) { login.user = e.target.value; } })]),
        h('label', null, ['Password', h('input', { id: 'l-pass', name: 'password', type: 'password', autocomplete: 'current-password' })]),
        h('div', { class: 'msg err', role: 'alert' }, login.err),
        h('div', null, h('button', { class: 'btn', type: 'submit', disabled: login.busy }, login.busy ? 'Checking…' : 'Log in')),
        h('p', { class: 'preview flush' }, ['Just here for the scores? ', h('a', { href: '?view=live' }, 'See the live board'), '.'])
      ])
    ]));
    var f = document.getElementById(focusId || (login.user ? 'l-pass' : 'l-user'));
    if (f) f.focus();
  }
  function doLogin(e) {
    e.preventDefault();
    if (login.busy) return;
    if (Date.now() < login.until) {
      login.err = 'Too many tries. Wait ' + Math.ceil((login.until - Date.now()) / 1000) + ' seconds.';
      return renderLogin('l-pass');
    }
    var u = document.getElementById('l-user').value.trim(), pw = document.getElementById('l-pass').value;
    login.user = u; login.busy = true; login.err = ''; renderLogin('l-pass');
    checkLogin(u, pw).then(function (ok) {
      login.busy = false;
      if (!ok) {
        login.fails++;
        if (login.fails >= 5) { login.fails = 0; login.until = Date.now() + 30000; }
        login.err = 'Wrong username or password.';
        return renderLogin('l-pass');
      }
      login.fails = 0; login.err = '';
      try { localStorage.setItem(SESSION_KEY, String(Date.now() + SESSION_HOURS * 3600000)); } catch (err) {}
      ui.focus = 'j-name';
      renderJudge(); syncChanged(); pullLatest();
    }).catch(function () {
      login.busy = false; login.err = 'This browser can\u2019t check the password. Use Safari or Chrome over https.';
      renderLogin();
    });
  }
  function logOut() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    login.user = ''; renderLogin();
  }

  function renderJudge() {
    if (!loggedIn()) return renderLogin();
    // The view is rebuilt on every change; carry focus (and caret) across by element id.
    var a = document.activeElement, focusId = ui.focus || (a && app.contains(a) && a.id) || '', caret = null;
    try { if (a && a.id === focusId && a.selectionStart != null) caret = [a.selectionStart, a.selectionEnd]; } catch (e) {}
    ui.focus = '';
    buildJudge();
    var f = focusId && document.getElementById(focusId);
    if (f && !f.disabled) {
      f.focus();
      try { if (caret) f.setSelectionRange(caret[0], caret[1]); } catch (e) {}
    }
  }

  function buildJudge() {
    document.body.className = '';
    var ranks = {}; standings().forEach(function (p, i) { ranks[p.id] = i + 1; });
    var q = ui.filter.trim().toLowerCase();
    var list = state.pickers.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; });

    var rows = list.map(function (p) {
      return h('tr', { class: ranks[p.id] <= FINALISTS && p.locks > 0 ? 'finalist' : '' }, [
        h('td', null, h('input', { id: 'j-h-' + p.id, class: 'handle', value: p.name, maxlength: '40', autocomplete: 'off', 'aria-label': 'Handle',
          onchange: function (e) { renamePicker(p, e.target.value); },
          onkeydown: function (e) { if (e.key === 'Enter') e.target.blur(); } })),
        h('td', null, h('div', { class: 'stepper' }, [
          h('button', { class: 'btn secondary step', type: 'button', id: 'j-m-' + p.id, 'aria-label': 'One fewer lock for ' + p.name, disabled: p.locks <= 0,
            onclick: function () { setLocks(p, p.locks - 1); } }, '−'),
          h('input', { id: 'j-l-' + p.id, class: 'locks', value: String(p.locks), inputmode: 'numeric', pattern: '[0-9]*', maxlength: '2', autocomplete: 'off', 'aria-label': 'Locks opened by ' + p.name,
            onchange: function (e) { setLocks(p, parseLocks(e.target.value)); },
            onkeydown: function (e) { if (e.key === 'Enter') e.target.blur(); } }),
          h('button', { class: 'btn step', type: 'button', id: 'j-p-' + p.id, 'aria-label': 'One more lock for ' + p.name,
            onclick: function () { setLocks(p, p.locks + 1); } }, '+')
        ])),
        h('td', { class: 'num' }, '#' + ranks[p.id]),
        h('td', { class: 'num' }, h('button', { class: 'btn danger small', type: 'button', id: 'j-x-' + p.id, 'aria-label': 'Remove ' + p.name,
          onclick: function () { removePicker(p); } }, 'Remove'))
      ]);
    });

    app.replaceChildren(h('main', { class: 'judge' }, [
      h('header', null, [
        h('div', null, [h('div', { class: 'eyebrow' }, 'LASCON 2026 · Judge station'), h('h1', null, 'Lock Ladder Scoreboard')]),
        h('div', { class: 'tools' }, [
          h('a', { class: 'btn secondary', href: '?view=display', target: 'lockladder-display' }, 'Open board on this device'),
          h('button', { class: 'btn secondary', type: 'button', onclick: logOut }, 'Log out')
        ])
      ]),
      h('div', { class: 'msg ' + ui.msgKind }, ui.msg),
      h('section', { class: 'card' }, [
        h('h2', null, 'Pickers'),
        h('form', { class: 'addrow', onsubmit: addPicker }, [
          h('label', null, ['Handle / nickname', h('input', { id: 'j-name', value: ui.name, maxlength: '40', autocomplete: 'off', autocapitalize: 'off', placeholder: 'as it shows on the board',
            oninput: function (e) { ui.name = e.target.value; } })]),
          h('label', { class: 'narrow' }, ['Locks opened', h('input', { id: 'j-locks', value: ui.locks, inputmode: 'numeric', pattern: '[0-9]*', maxlength: '2', autocomplete: 'off',
            oninput: function (e) { ui.locks = e.target.value; } })]),
          h('button', { class: 'btn', id: 'j-add', type: 'submit' }, 'Add')
        ]),
        state.pickers.length > 8 ? h('label', null, ['Find a picker', h('input', { id: 'j-find', type: 'search', value: ui.filter, autocomplete: 'off', placeholder: 'start typing a handle',
          oninput: function (e) { ui.filter = e.target.value; renderJudge(); } })]) : null,
        state.pickers.length
          ? h('table', { class: 'entry' }, [
              h('thead', null, h('tr', null, [h('th', null, 'Handle / nickname'), h('th', null, 'Locks opened'), h('th', { class: 'num' }, 'Rank'), h('th', null, h('span', { class: 'sr-only' }, 'Remove'))])),
              h('tbody', null, rows.length ? rows : h('tr', null, h('td', { colspan: '4', class: 'empty' }, 'No handle matches “' + ui.filter + '”.')))
            ])
          : h('p', { class: 'empty flush' }, 'No pickers yet. Add the first one above.'),
        h('p', { class: 'preview flush' }, 'Tap + each time someone opens another lock. Ties go to whoever reached that count first. Kids must be with a parent or guardian.')
      ]),
      h('section', { class: 'card' }, [
        h('h2', null, 'Online scoreboard'),
        h('p', { class: 'preview flush' }, ['The ', h('a', { href: '?view=live', target: '_blank' }, 'public page'),
          ' and the iPad board show what this device publishes. It needs a GitHub token that can write only to this repo; the token stays on this device.']),
        h('div', { class: 'msg', id: 'syncstatus' }, ''),
        getToken()
          ? h('div', { class: 'tools' }, [
              h('button', { class: 'btn secondary', onclick: function () { clearTimeout(sync.timer); publish(); } }, 'Publish now'),
              h('button', { class: 'btn danger', onclick: function () {
                if (!confirm('Remove the token from this device? The public page stops updating.')) return;
                setToken(''); sync.status = 'idle'; renderJudge();
              } }, 'Forget token')
            ])
          : h('form', { class: 'row', onsubmit: function (e) {
              e.preventDefault();
              var t = e.target.querySelector('input').value.trim();
              if (!t) return;
              setToken(t); renderJudge(); publish();
            } }, [
              h('label', null, ['GitHub token', h('input', { type: 'password', autocomplete: 'off', spellcheck: 'false' })]),
              h('button', { class: 'btn', type: 'submit' }, 'Save token')
            ])
      ]),
      h('section', { class: 'card' }, [
        h('h2', null, 'Backup'),
        h('p', { class: 'preview flush' }, 'This device holds the real scores; the online copy is for viewing. Export a backup at every break and at the end of each day.'),
        h('div', { class: 'tools' }, [
          h('button', { class: 'btn secondary', onclick: exportData }, 'Export backup'),
          h('button', { class: 'btn secondary', id: 'j-restore', type: 'button', onclick: function () { document.getElementById('j-restore-file').click(); } }, 'Restore backup'),
          h('input', { id: 'j-restore-file', class: 'sr-only', type: 'file', accept: 'application/json', tabindex: '-1', 'aria-hidden': 'true', onchange: importData }),
          h('button', { class: 'btn danger', onclick: resetAll }, 'Reset scoreboard')
        ])
      ])
    ]));
  }

  // ---- wiring ----
  function render() { (isDisplay ? renderDisplay : renderJudge)(); syncChanged(); }
  function refresh() { state = load(); render(); }
  // keep a display screen awake (iPad Safari 16.4+, Chrome); harmless where unsupported
  var wake = null;
  function keepAwake() {
    if (!isDisplay || isLive || !navigator.wakeLock || document.hidden || wake) return;
    navigator.wakeLock.request('screen').then(function (w) {
      wake = w; w.addEventListener('release', function () { wake = null; });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake);
  keepAwake();

  if (isRemote) {
    pollLive();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) pollLive(); });
    if (isBoard) {
      setInterval(function () { page++; renderDisplay(); }, 12000);
      window.addEventListener('resize', function () { PER_PAGE = 10; renderDisplay(); });
    }
  } else {
    window.addEventListener('storage', function (e) { if (e.key === KEY) refresh(); });
    if (channel) channel.onmessage = refresh;
    if (isDisplay) {
      setInterval(function () { page++; renderDisplay(); }, 12000);
      window.addEventListener('resize', function () { PER_PAGE = 10; renderDisplay(); });
    }
    render();
    if (!isDisplay) {
      pullLatest();
      setInterval(pullLatest, 60000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) pullLatest(); });
    }
  }
})();
</script>
</body>
</html>
